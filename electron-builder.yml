appId: com.ramji.codetogether
productName: CodeTogether
copyright: Copyright © 2026 Ramji

directories:
  output: dist-electron
  buildResources: electron/build-resources

asar: true
afterSign: electron/notarize.js

files:
  - "electron/**/*"
  - "server.js"
  - "server/**/*"
  - ".next/**/*"
  - "public/**/*"
  - "package.json"
  - "package-lock.json"
  - "node_modules/**/*"
  - "!node_modules/.cache/**/*"
  - "!**/*.map"
  - "!**/*.tsbuildinfo"
  - "!temp_workspaces/**/*"
  - "!temp_runs/**/*"
  - "!electron/build-resources/**/*"
  - "!electron/notarize.js"
  - "!electron/generate-icons.js"

extraMetadata:
  main: "electron/main.js"

mac:
  category: public.app-category.developer-tools
  icon: electron/build-resources/icon.icns
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: electron/build-resources/entitlements.mac.plist
  entitlementsInherit: electron/build-resources/entitlements.mac.plist
  extendInfo:
    NSCameraUsageDescription: CodeTogether uses the camera for video calls.
    NSMicrophoneUsageDescription: CodeTogether uses the microphone for voice calls.

dmg:
  sign: false
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

win:
  icon: electron/build-resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  shortcutName: CodeTogether

linux:
  icon: electron/build-resources
  category: Development
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
