name: Build Desktop Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install setuptools
      - run: npm ci
      - name: Write .env.local
        shell: bash
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}" > .env.local
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" >> .env.local
          echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> .env.local
          echo "NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}" >> .env.local
          echo "SMTP_USER=${{ vars.SMTP_USER }}" >> .env.local
          echo "SMTP_PASS=${{ secrets.SMTP_PASS }}" >> .env.local
          echo "NEXT_PUBLIC_ANTHROPIC_API_KEY=${{ secrets.NEXT_PUBLIC_ANTHROPIC_API_KEY }}" >> .env.local
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" >> .env.local
      - name: Build Next.js
        run: npx next build
      - name: Build Electron Mac
        run: npx electron-builder --mac
      - uses: actions/upload-artifact@v4
        with:
          name: mac-builds
          path: dist-electron/*.dmg
          retention-days: 30

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Write .env.local
        shell: pwsh
        run: |
          Set-Content -Path .env.local -Value @(
            "NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}",
            "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}",
            "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}",
            "NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}",
            "SMTP_USER=${{ vars.SMTP_USER }}",
            "SMTP_PASS=${{ secrets.SMTP_PASS }}",
            "NEXT_PUBLIC_ANTHROPIC_API_KEY=${{ secrets.NEXT_PUBLIC_ANTHROPIC_API_KEY }}",
            "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}"
          )
      - name: Build Next.js
        run: npx next build
      - name: Build Electron Windows
        run: npx electron-builder --win
      - uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          path: dist-electron/*.exe
          retention-days: 30

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install setuptools
      - run: npm ci
      - name: Write .env.local
        shell: bash
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}" > .env.local
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" >> .env.local
          echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> .env.local
          echo "NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}" >> .env.local
          echo "SMTP_USER=${{ vars.SMTP_USER }}" >> .env.local
          echo "SMTP_PASS=${{ secrets.SMTP_PASS }}" >> .env.local
          echo "NEXT_PUBLIC_ANTHROPIC_API_KEY=${{ secrets.NEXT_PUBLIC_ANTHROPIC_API_KEY }}" >> .env.local
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" >> .env.local
      - name: Build Next.js
        run: npx next build
      - name: Build Electron Linux
        run: npx electron-builder --linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux-builds
          path: |
            dist-electron/*.AppImage
            dist-electron/*.deb
          retention-days: 30

  release:
    needs: [build-mac, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/mac-builds/*
            artifacts/windows-builds/*
            artifacts/linux-builds/*
